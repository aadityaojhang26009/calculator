<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rs{
            color: red;
        }
    </style>
</head>
<body>
    
    <form action="">
        <label for="">Number 1</label>
        <input type="text" placeholder="Enter your number 1" id="a">
        <br>
        <br>
        <label for="">Number 2</label>
        <input type="text" placeholder="Enter your number 2" id="b">
        <br>
        <br>
        <button id="btn">+</button>
        <button id="btn1">-</button>
        <button id="btn2">*</button>
        <button id="btn3">/</button>

    </form>

    <h1>result :- <span id="rs">0</span></h1>



    <script>
       
        var c = document.getElementById('btn')

        c.addEventListener('click' , function(addition){
            addition.preventDefault()
            var a = document.getElementById('a').value
            var b = document.getElementById('b').value
            var result = document.getElementById('rs')
            
        var add = parseInt(a) + parseInt(b)
        result.innerHTML=add
            
        })

        var d = document.getElementById('btn1')
        d.addEventListener('click' , function(subtraction){
            subtraction.preventDefault()
            var a = document.getElementById('a').value
            var b = document.getElementById('b').value
            var result = document.getElementById('rs')
            
        var sub = parseInt(a) - parseInt(b)
        result.innerHTML= sub
            
        })

        var e = document.getElementById('btn2')
        e.addEventListener('click' , function(product){
            product.preventDefault()
            var a = document.getElementById('a').value
            var b = document.getElementById('b').value
            var result = document.getElementById('rs')
            
        var product = parseInt(a) * parseInt(b)
        result.innerHTML= product
            
        })

        var f = document.getElementById('btn3')
        f.addEventListener('click' , function(divide){
            divide.preventDefault()
            var a = document.getElementById('a').value
            var b = document.getElementById('b').value
            var result = document.getElementById('rs')
            
        var divide = parseInt(a) / parseInt(b)
        result.innerHTML= divide
            
        })

    </script>

</body>
</html>
